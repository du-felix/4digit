{% load static %}
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Freistellungen{% endblock %} – St. Afra</title>
  <link rel="stylesheet" href="{% static 'css/base.css' %}">
  {% block extra_head %}{% endblock %}
</head>
<body>
  <header>
    <a href="{% url 'login' %}" class="nav-brand">
      <img src="{% static 'images/logo.png' %}" alt="St. Afra">
    </a>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer><p>&copy; 2025 4digit</p></footer>
  {% block extra_scripts %}{% endblock %}
</body>
</html>
