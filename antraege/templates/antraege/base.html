{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}My Site{% endblock %}</title>
    <!-- Link to your CSS file -->
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    <link rel="stylesheet" href="{% static 'css/table.css' %}">
    {% block extra_head %}
    <!-- Additional head elements can go here -->
    {% endblock %}
</head>
<body>
    <style>
        .banner {
    padding: 1em;
    border-radius: 5px;
    margin-bottom: 1em;
    text-align: center;
}

.banner.success {
    background-color: #d4edda;
    color: #155724;
}

.banner.error {
    background-color: #f8d7da;
    color: #721c24;
}

.banner.info {
    background-color: #d1ecf1;
    color: #0c5460;
}
    </style>
    <header>
        <div>
            <a href="{% url 'home' %}"><img src="{% static 'images/logo.png' %}" alt="4digit"></a>
            
        </div>
        <div style="display: flex; gap: 12px; justify-content: center; align-items: center;">
            <a href="{% url 'neuer_antrag' %}"><input type="button" value="Freistellungsantrag stellen"></a>
            <form action="{% url 'logout' %}" method="post" style="display:inline;">
                {% csrf_token %}
                <button type="submit">Abmelden</button>
            </form>
        </div>
    </header>
    <main style="display: flex; flex-direction: column; min-height: 88vh;">
        {% block content %}
                {% if messages %}
        <div>
            {% for message in messages %}
            <div class="banner {{ message.tags }}">
                {{ message }}
            </div>
            {% endfor %}
        </div>
        {% endif %}
        {% endblock %}
    </main>
    <footer>
        <p>&copy; 2025 4digit</p>
    </footer>
    <!-- Optional JavaScript files -->
    {% block extra_scripts %}
    <!-- Additional scripts can be added by child templates -->
    {% endblock %}
</body>
</html>
