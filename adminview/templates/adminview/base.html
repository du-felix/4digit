{% load static %}
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Admin{% endblock %} – St. Afra</title>
  <script>
    (function(){var s=localStorage.getItem('theme');document.documentElement.setAttribute('data-theme',s||(window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'));})();
  </script>
  <link rel="stylesheet" href="{% static 'css/base.css' %}">
  <link rel="stylesheet" href="{% static 'css/table.css' %}">
  {% block extra_head %}{% endblock %}
</head>
<body>
  <header>
    <a href="{% url 'adminview-home' %}" class="nav-brand">
      <img src="{% static 'images/logo_dark.png' %}" alt="St. Afra" class="logo-dark">
      <img src="{% static 'images/logo_white.png' %}" alt="St. Afra" class="logo-light">
    </a>

    <!-- Desktop + mobile nav links -->
    <nav class="nav-links" id="main-nav">
      <a href="{% url 'admin-dashboard' %}"
         class="{% if request.resolver_match.url_name == 'admin-dashboard' %}active{% endif %}">Log</a>
      <a href="{% url 'admin-analytics' %}"
         class="{% if request.resolver_match.url_name == 'admin-analytics' %}active{% endif %}">Analytik</a>
      <a href="{% url 'admin-antraege' %}"
         class="{% if request.resolver_match.url_name == 'admin-antraege' %}active{% endif %}">Anträge</a>
      <a href="{% url 'adminview-home' %}"
         class="{% if request.resolver_match.url_name == 'adminview-home' or request.resolver_match.url_name == 'user_edit' or request.resolver_match.url_name == 'add_user' or request.resolver_match.url_name == 'adminview-csv' %}active{% endif %}">Benutzer</a>
      <a href="{% url 'lehrer' %}"
         class="{% if request.resolver_match.url_name == 'lehrer' or request.resolver_match.url_name == 'lehrer_edit' or request.resolver_match.url_name == 'add_lehrer' or request.resolver_match.url_name == 'lehrer_csv' %}active{% endif %}">Lehrer</a>
      <!-- Logout shown only inside mobile dropdown -->
      <div class="nav-mobile-only">
        <form action="{% url 'logout' %}" method="post" style="margin:0;">
          {% csrf_token %}
          <button type="submit" class="btn btn-ghost btn-sm" style="width:100%; justify-content:flex-start;">Abmelden</button>
        </form>
      </div>
    </nav>

    <div class="nav-actions">
      <button id="theme-toggle" class="theme-toggle" aria-label="Theme wechseln">
        <svg class="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
      <!-- Logout: shown on desktop, hidden on mobile (available via hamburger) -->
      <div class="nav-desktop-only">
        <form action="{% url 'logout' %}" method="post" style="margin:0;">
          {% csrf_token %}
          <button type="submit" class="btn btn-ghost btn-sm">Abmelden</button>
        </form>
      </div>
      <!-- Hamburger: hidden on desktop, shown on mobile -->
      <button class="nav-hamburger" id="nav-hamburger" aria-label="Menü öffnen" aria-expanded="false">
        <svg viewBox="0 0 18 18"><line x1="1" y1="4" x2="17" y2="4"/><line x1="1" y1="9" x2="17" y2="9"/><line x1="1" y1="14" x2="17" y2="14"/></svg>
      </button>
    </div>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer><p>&copy; 2025 4digit</p></footer>
  <script src="{% static 'js/theme.js' %}"></script>
  <script>
  (function () {
    var btn = document.getElementById('nav-hamburger');
    var nav = document.getElementById('main-nav');
    if (!btn || !nav) return;
    btn.addEventListener('click', function () {
      var open = nav.classList.toggle('is-open');
      btn.setAttribute('aria-expanded', open ? 'true' : 'false');
    });
    // Close when a nav link is clicked (SPA-style navigation)
    nav.querySelectorAll('a').forEach(function (a) {
      a.addEventListener('click', function () {
        nav.classList.remove('is-open');
        btn.setAttribute('aria-expanded', 'false');
      });
    });
    // Close on outside click
    document.addEventListener('click', function (e) {
      if (!nav.contains(e.target) && !btn.contains(e.target)) {
        nav.classList.remove('is-open');
        btn.setAttribute('aria-expanded', 'false');
      }
    });
  })();
  </script>
  {% block extra_scripts %}{% endblock %}
</body>
</html>
