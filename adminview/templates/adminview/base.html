{% load static %}
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Admin{% endblock %} – St. Afra</title>
  <link rel="stylesheet" href="{% static 'css/base.css' %}">
  <link rel="stylesheet" href="{% static 'css/table.css' %}">
  {% block extra_head %}{% endblock %}
</head>
<body>
  <header>
    <a href="{% url 'adminview-home' %}">
      <img src="{% static 'images/logo.png' %}" alt="St. Afra">
    </a>
    <div class="nav-actions">
      <a href="{% url 'lehrer' %}" class="btn btn-outline btn-sm">Lehrerliste</a>
      <a href="{{ button_url }}" class="btn btn-outline btn-sm">CSV hochladen</a>
      <form action="{% url 'logout' %}" method="post" style="margin:0;">
        {% csrf_token %}
        <button type="submit" class="btn btn-outline btn-sm">Abmelden</button>
      </form>
    </div>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer><p>&copy; 2025 4digit</p></footer>
  {% block extra_scripts %}{% endblock %}
</body>
</html>
