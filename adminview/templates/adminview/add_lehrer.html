{% extends "adminview/base.html" %}
{% block title %}Neuer Lehrer{% endblock %}

{% block content %}
<div class="container" style="max-width: 480px;">
  <div class="mb-4">
    <a href="{% url 'lehrer' %}" class="back-link">← Zurück</a>
  </div>
  <div class="form-card">
    <h2>Neuen Lehrer hinzufügen</h2>
    <form method="post">
      {% csrf_token %}
      <div class="form-group">
        <label for="email">E-Mail-Adresse</label>
        <input type="email" id="email" name="email" required>
      </div>
      <div class="form-group">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required>
      </div>
      <div class="form-actions">
        <a href="{% url 'lehrer' %}" class="btn btn-outline">Abbrechen</a>
        <button type="submit">Lehrer anlegen</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
